<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOICE | 404 - Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Meta Tags -->
  <meta name="description" content="Decentralized consensus protocol on Ethereum Sepolia. Run transparent multi-option polls with zero double voting." />
  <meta property="og:title" content="VOICE | 404 - Page Not Found" />
  <meta property="og:description" content="The page or ballot you were looking for could not be found on Ethereum Sepolia." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://voice-voting-dapp.vercel.app/404.html" />
  <meta property="og:image" content="https://voice-voting-dapp.vercel.app/assets/memes/meme-01-raccoon-sleepy-coins.jpg" />

  <!-- Self-contained inline CSS -->
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #141414;
      --surface-card: #1C1C1C;
      --border: #2A2A2A;
      --text: #F5F5F5;
      --text-muted: #8E8E93;
      --accent-lime: #C6FF4D;
      --accent-orange: #FF5A1F;
      --accent-orange-hover: #E04810;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #F7F7F8;
        --surface: #FFFFFF;
        --surface-card: #F2F2F7;
        --border: #E5E5EA;
        --text: #1C1C1E;
        --text-muted: #636366;
      }
    }

    [data-theme="light"] {
      --bg: #F7F7F8;
      --surface: #FFFFFF;
      --surface-card: #F2F2F7;
      --border: #E5E5EA;
      --text: #1C1C1E;
      --text-muted: #636366;
    }

    [data-theme="dark"] {
      --bg: #0A0A0A;
      --surface: #141414;
      --surface-card: #1C1C1C;
      --border: #2A2A2A;
      --text: #F5F5F5;
      --text-muted: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 540px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-cube {
      width: 56px;
      height: 56px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 90, 31, 0.15);
      border: 1px solid rgba(255, 90, 31, 0.3);
      color: var(--accent-orange);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-orange);
    }

    .not-found-code {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent-orange);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--text);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-orange);
      color: #0A0A0A;
      border: 1px solid var(--border);
    }

    .btn-primary:hover {
      background: var(--accent-orange-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
      color: var(--text);
    }
  </style>

  <script>
    try {
      const savedTheme = localStorage.getItem('multipoll_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="container">
    <!-- Inline Isometric Cube Logo -->
    <div class="brand-cube" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="56" height="56" fill="none">
        <path d="M16 3 L28 10 L16 17 L4 10 Z" fill="#C6FF4D" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M4 10 L16 17 L16 29 L4 22 Z" fill="#FF5A1F" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M16 17 L28 10 L28 22 L16 29 Z" fill="#D9430F" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <polyline points="7 19 11 23 15 15" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Block Not Found</span>
    </div>

    <div class="not-found-code">404</div>

    <h1>Page or Ballot Not Found</h1>

    <p>
      The destination or poll ID you were looking for doesn't exist on this block or was permanently reorganized.
    </p>

    <!-- Inline Smiley / Sticker SVG Illustration -->
    <div style="margin: 4px 0;" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="80" height="80" fill="none">
        <circle cx="50" cy="50" r="44" fill="#FFC20E" stroke="#0A0A0A" stroke-width="5"/>
        <path d="M28 42c4-6 12-6 16 0" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
        <circle cx="68" cy="40" r="5" fill="#0A0A0A"/>
        <path d="M26 56c4 16 34 16 48 0" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
        <path d="M42 63c0 8 16 8 16 0" fill="#FF5A1F" stroke="#0A0A0A" stroke-width="3"/>
      </svg>
    </div>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">
        <span>Return Home</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
      <a href="polls.html" class="btn btn-secondary">
        <span>Explore All Polls</span>
      </a>
    </div>
  </div>
</body>
</html>
